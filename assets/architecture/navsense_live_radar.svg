<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480">
  <defs>
    <style>
      @keyframes blinkAlert {
        0%, 100% { opacity: 1; fill: #ef4444; }
        50% { opacity: 0.3; fill: #7f1d1d; }
      }
      @keyframes pathDraw {
        0% { stroke-dashoffset: 600; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes needleOscillate {
        0%, 100% { transform: rotate(-8deg); }
        50% { transform: rotate(12deg); }
      }
      @keyframes glowPulse {
        0%, 100% { filter: drop-shadow(0 0 6px #10b981); }
        50% { filter: drop-shadow(0 0 16px #34d399); }
      }

      .hud-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 16px; fill: #ffffff; letter-spacing: 1px; }
      .hud-subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #94a3b8; }
      .hud-metric { font-family: 'SF Mono', Monaco, Consolas, 'Liberation Mono', monospace; font-weight: 700; font-size: 22px; fill: #38bdf8; }
      .hud-unit { font-size: 12px; fill: #64748b; }
      .alert-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 12px; letter-spacing: 1px; fill: #fca5a5; }

      .alert-pulse { animation: blinkAlert 1.5s infinite ease-in-out; }
      .fusion-path { stroke-dasharray: 600; animation: pathDraw 4s ease-out infinite, glowPulse 2s infinite ease-in-out; }
      .needle-anim { transform-origin: 790px 240px; animation: needleOscillate 6s ease-in-out infinite; }
    </style>

    <linearGradient id="hudBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#131b2e" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>

    <linearGradient id="fusionGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <!-- Container Base -->
  <rect width="960" height="480" rx="16" fill="url(#hudBg)" stroke="#1e293b" stroke-width="2" />

  <!-- Grid Overlay -->
  <g opacity="0.15">
    <line x1="40" y1="120" x2="920" y2="120" stroke="#38bdf8" stroke-width="1" />
    <line x1="40" y1="240" x2="920" y2="240" stroke="#38bdf8" stroke-width="1" />
    <line x1="40" y1="360" x2="920" y2="360" stroke="#38bdf8" stroke-width="1" />
    <line x1="200" y1="40" x2="200" y2="440" stroke="#38bdf8" stroke-width="1" />
    <line x1="400" y1="40" x2="400" y2="440" stroke="#38bdf8" stroke-width="1" />
    <line x1="640" y1="40" x2="640" y2="440" stroke="#38bdf8" stroke-width="1" />
  </g>

  <!-- Top Banner Header -->
  <g transform="translate(40, 32)">
    <text class="hud-title" x="0" y="0">NAVSENSE SIMULATION HUD</text>
    <text class="hud-subtitle" x="0" y="20">Comparative In-Flight Trajectory Tracking Under 60s Induced GNSS Blackout</text>

    <!-- Blackout Alarm Pill -->
    <rect x="680" y="-16" width="200" height="30" rx="15" fill="#450a0a" stroke="#b91c1c" stroke-width="1.5" />
    <circle cx="700" cy="-1" r="6" class="alert-pulse" />
    <text class="alert-text" x="715" y="3">GNSS LOSS: 60s OUTAGE</text>
  </g>

  <!-- LEFT PANEL: TRAJECTORY COMPARISON (0 to 620 px) -->
  <g transform="translate(40, 75)">
    <rect width="580" height="360" rx="12" fill="url(#panelGrad)" stroke="#1e293b" stroke-width="1.5" />
    <text class="hud-title" x="24" y="34" font-size="14">Trajectory Reconstruction vs. Ground Truth</text>
    <text class="hud-subtitle" x="24" y="52">Road Corridor: Winding Mountain Arterial (`Vw12`) • Outage Duration: 60.0s</text>

    <!-- Ground Truth Center Road Line (Light Grey Dashed) -->
    <path d="M 60 300 C 140 280, 180 200, 260 210 C 340 220, 380 120, 460 110 C 500 105, 530 115, 550 120" fill="none" stroke="#475569" stroke-width="10" stroke-linecap="round" opacity="0.3" />
    <path d="M 60 300 C 140 280, 180 200, 260 210 C 340 220, 380 120, 460 110 C 500 105, 530 115, 550 120" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 6" />

    <!-- Pure IMU Catastrophic Divergence Path (Red Dotted) -->
    <path d="M 60 300 C 120 280, 170 230, 220 180 C 270 130, 340 60, 420 20" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="4 6" opacity="0.85" />
    <circle cx="420" cy="20" r="5" fill="#ef4444" />
    <text x="430" y="24" fill="#f87171" font-size="11" font-weight="700" font-family="monospace">Pure IMU Divergence (+650m / 43.4%)</text>

    <!-- NavSense Adaptive Fusion Path (Green Glowing Solid) -->
    <path class="fusion-path" d="M 60 300 C 140 280, 180 200, 260 210 C 340 220, 380 120, 460 110 C 500 105, 530 115, 550 120" fill="none" stroke="url(#fusionGrad)" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="550" cy="120" r="6" fill="#34d399" />
    <circle cx="550" cy="120" r="10" fill="none" stroke="#34d399" stroke-width="1.5" opacity="0.6" />
    <text x="440" y="145" fill="#34d399" font-size="11" font-weight="700" font-family="monospace">NavSense Adaptive (45m / 3.01% PASS ✅)</text>

    <!-- Origin Tag -->
    <circle cx="60" cy="300" r="6" fill="#38bdf8" />
    <text x="50" y="325" fill="#38bdf8" font-size="10" font-family="monospace" font-weight="700">GNSS LOSS (t=0s)</text>

    <!-- Legend -->
    <g transform="translate(24, 320)">
      <rect x="0" y="0" width="532" height="26" rx="6" fill="#090d16" stroke="#1e293b" />
      <line x1="20" y1="13" x2="45" y2="13" stroke="#64748b" stroke-width="2" stroke-dasharray="4 4" />
      <text x="55" y="17" fill="#94a3b8" font-size="10">Ground Truth CAN</text>

      <line x1="170" y1="13" x2="195" y2="13" stroke="#ef4444" stroke-width="2" stroke-dasharray="4 4" />
      <text x="205" y="17" fill="#f87171" font-size="10">Pure IMU (Cubic Drift)</text>

      <line x1="330" y1="13" x2="355" y2="13" stroke="#10b981" stroke-width="3" />
      <text x="365" y="17" fill="#34d399" font-size="10" font-weight="700">NavSense Adaptive Fusion</text>
    </g>
  </g>

  <!-- RIGHT PANEL: HUD COMPASS & TELEMETRY GAUGES (640 to 920 px) -->
  <g transform="translate(640, 75)">
    <rect width="280" height="360" rx="12" fill="url(#panelGrad)" stroke="#1e293b" stroke-width="1.5" />

    <!-- Compass Dial -->
    <g transform="translate(0, 0)">
      <circle cx="140" cy="110" r="70" fill="#090d16" stroke="#1e293b" stroke-width="2" />
      <circle cx="140" cy="110" r="54" fill="none" stroke="#334155" stroke-dasharray="4 4" />

      <!-- Compass Ticks & Labels -->
      <text x="140" y="52" fill="#38bdf8" font-size="10" font-family="monospace" font-weight="700" text-anchor="middle">N</text>
      <text x="140" y="174" fill="#64748b" font-size="10" font-family="monospace" text-anchor="middle">S</text>
      <text x="80" y="113" fill="#64748b" font-size="10" font-family="monospace">W</text>
      <text x="195" y="113" fill="#64748b" font-size="10" font-family="monospace">E</text>

      <!-- Oscillating Compass Needle -->
      <g class="needle-anim" style="transform-origin: 140px 110px;">
        <polygon points="140,58 144,110 136,110" fill="#ef4444" />
        <polygon points="140,162 144,110 136,110" fill="#64748b" />
        <circle cx="140" cy="110" r="4" fill="#ffffff" />
      </g>
      <text x="140" y="195" fill="#94a3b8" font-size="11" font-family="monospace" text-anchor="middle">HEADING: 014° NNE</text>
    </g>

    <!-- Telemetry Readouts -->
    <g transform="translate(20, 215)">
      <!-- Metric 1: Forward Speed -->
      <rect x="0" y="0" width="115" height="56" rx="6" fill="#090d16" stroke="#1e293b" />
      <text class="hud-metric" x="12" y="28">84.2<tspan class="hud-unit"> km/h</tspan></text>
      <text class="hud-subtitle" x="12" y="46">TCN FORWARD VEL</text>

      <!-- Metric 2: 60s Outage Drift -->
      <rect x="125" y="0" width="115" height="56" rx="6" fill="#090d16" stroke="#1e293b" />
      <text class="hud-metric" x="137" y="28" fill="#34d399">3.01<tspan class="hud-unit"> %</tspan></text>
      <text class="hud-subtitle" x="137" y="46">RELATIVE DRIFT</text>

      <!-- Metric 3: Active Regime State -->
      <rect x="0" y="66" width="240" height="60" rx="6" fill="#090d16" stroke="#1e293b" />
      <circle cx="16" cy="86" r="4" fill="#38bdf8" />
      <text x="26" y="90" fill="#38bdf8" font-size="11" font-weight="700" font-family="monospace">ACTIVE MOTION REGIME:</text>
      <text x="14" y="112" fill="#a5b4fc" font-size="12" font-weight="600">Dynamic Turn + ZVD Armed</text>
    </g>
  </g>
</svg>
